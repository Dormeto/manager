AWSTemplateFormatVersion: "2010-09-09"
Description: Dormeto discovery role, read-only (load balancers, rules, target groups, backends, request metrics)
Parameters:
  ManagerAccountId:
    Type: String
    AllowedPattern: "^\\d{12}$"
  ManagerRoleArns:
    Type: CommaDelimitedList
    Description: Manager discovery role ARNs allowed to assume this role (one per manager environment)
  OrganizationId:
    Type: String
    AllowedPattern: "^o-[a-z0-9]{10,32}$"
Resources:
  DiscoveryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: DmtDiscoveryRole
      Description: Dormeto discovery (read-only)
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${ManagerAccountId}:root"
            Action: sts:AssumeRole
            Condition:
              ArnLike:
                aws:PrincipalArn: !Ref ManagerRoleArns
              StringEquals:
                aws:PrincipalOrgID: !Ref OrganizationId
      Policies:
        - PolicyName: discovery
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Discovery
                Effect: Allow
                Action:
                  - ec2:DescribeRegions
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeListeners
                  - elasticloadbalancing:DescribeRules
                  - elasticloadbalancing:DescribeTags
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:DescribeTargetHealth
                  - autoscaling:DescribeAutoScalingGroups
                  - ecs:ListClusters
                  - ecs:ListServices
                  - ecs:DescribeServices
                  - cloudwatch:GetMetricData
                Resource: "*"
      Tags:
        - Key: dormeto:component
          Value: discovery
Outputs:
  RoleArn:
    Value: !GetAtt DiscoveryRole.Arn
